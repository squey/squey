<p>Keys</p>
<table>
<tr>
  <td class="shortcuts"><b>Enter</b>&nbsp;:</td>
  <td>run the query</td>
</tr>
<tr>
  <td class="shortcuts"><b>Ctrl+Enter</b>&nbsp;:</td>
  <td>break the line, as does Shift+Enter</td>
</tr>
<tr>
  <td class="shortcuts"><b>Ctrl+Space</b>&nbsp;:</td>
  <td>offers what fits where the cursor is — see the completion block</td>
</tr>
<tr>
  <td class="shortcuts"><b>Escape</b>&nbsp;:</td>
  <td>closes this page, or the completion list</td>
</tr>
<tr>
  <td class="shortcuts"><b>?</b>&nbsp;:</td>
  <td>this page, as does F1 or the button in the title bar</td>
</tr>
</table>

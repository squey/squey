variables:
  BASE_IMAGE_NAME: registry.gitlab.com/squey/container-images/squey_build:3937dd44
  GIT_SUBMODULE_STRATEGY: normal
  GIT_SUBMODULE_PATHS: src/external/type_safe src/furl src/squey-utils src/libpvcop
  GIT_SUBMODULE_DEPTH: 1
  GIT_STRATEGY: fetch
  CACHE_COMPRESSION_LEVEL: "fastest"
  CODE_COVERAGE:
    value: "false"
    description: "Only update the code coverage report"
  ADDRESS_SANITIZER:
    value: "false"
    description: "Run the test suite under the address sanitizer"
  FORCE_PUSH_ARTIFACTS:
    value: "false"
    description: "Push the build dependencies to the shared cache, even when the buildstream directory is unchanged"
  # Shared artifact pool the runner hosts, served by the buildbox-casd-artifacts
  # service. The path is the one seen from inside the job container, where the
  # /home/gitlab-runner/cache volume is mounted on /root/.cache.
  ARTIFACT_CACHE_URL: "unix:/root/.cache/artifact-cas.sock"

stages:
  - check
  - static_analysis
  - build
  - test
  - macos_publish
  - pages
  - flathub_publish
  - stop

# A scheduled pipeline whose commit was already fully built by a previous
# scheduled pipeline of the same kind has nothing to rebuild. The SHA of the last
# successful run is recorded by the "record_last_scheduled_sha" job into a project
# CI/CD variable, which is the only kind of state a "rules:if" clause can read at
# pipeline creation time. Nightly and code coverage schedules run different sets of
# jobs on the same commit, so each one gets its own marker. Set FORCE_REBUILD to
# "true" on the schedule to rebuild an unchanged commit anyway.
.ci_conditions:
  already_built: &already_built >-
    $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH &&
    $FORCE_REBUILD != "true" &&
    (($CODE_COVERAGE != "true" && $CI_COMMIT_SHA == $LAST_NIGHTLY_SHA) ||
    ($CODE_COVERAGE == "true" && $CI_COMMIT_SHA == $LAST_COVERAGE_SHA))

workflow:
  rules:
    # Keep creating the pipeline so that it shows up as successful, but strip it
    # down to the "nightly_skipped" sentinel job. container_scanning comes from an
    # included template whose rules we do not own, so it is turned off through the
    # variable the template itself provides.
    - if: *already_built
      variables:
        CONTAINER_SCANNING_DISABLED: "true"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_TAG =~ /^release-\d+\.\d+\.\d+$/'

# Filters a job out of a scheduled pipeline that has nothing to rebuild. Must come
# first in the "rules" list of every job that can run in a scheduled pipeline.
.skip_if_already_built:
  rules:
    - if: *already_built
      when: never

# Sentinel job of a skipped scheduled pipeline: a pipeline whose jobs are all
# filtered out is not created at all, which the schedule reports as an error
# instead of a success. This one keeps the pipeline valid, green and free.
nightly_skipped:
  image:
    name: "$BASE_IMAGE_NAME"
    pull_policy: [if-not-present]
  stage: check
  tags:
    - privileged-docker
  needs: []
  variables:
    GIT_STRATEGY: none
    GIT_SUBMODULE_STRATEGY: none
  # Carry over the coverage of the pipeline that really built this commit: the
  # project badge reads the coverage of the latest successful pipeline of the
  # branch, and falls back to "unknown" as soon as that pipeline has none of its
  # own. Passing "?job=" to the badge does not help, it looks the job up in those
  # same latest pipelines.
  coverage: '/Coverage: (\d+(?:\.\d+)?)%/'
  script:
    - |
      echo "$CI_COMMIT_BRANCH is still at $CI_COMMIT_SHA, already built by a previous scheduled pipeline, nothing to do."
      api_url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines"
      for id in $(curl --silent --get --data-urlencode "ref=$CI_COMMIT_BRANCH" \
        --data-urlencode "status=success" --data-urlencode "per_page=20" "$api_url" \
        | jq -r ".[] | select(.id != $CI_PIPELINE_ID) | .id"); do
        coverage=$(curl --silent "$api_url/$id" | jq -r '.coverage // empty')
        if [ -n "$coverage" ]; then
          echo "Coverage: $coverage% (reused from pipeline $id)"
          break
        fi
      done
      [ -n "$coverage" ] || echo "No coverage found in the last 20 successful pipelines of $CI_COMMIT_BRANCH, the badge will show 'unknown'"
  rules:
    - if: *already_built

# Records the commit a scheduled pipeline just built, so that the next scheduled
# run on the same commit skips straight to "nightly_skipped". Writing a project
# CI/CD variable requires GITLAB_API_TOKEN to hold the 'api' scope and the
# Maintainer role; a failure here only costs a redundant rebuild next time.
record_last_scheduled_sha:
  image:
    name: "$BASE_IMAGE_NAME"
    pull_policy: [if-not-present]
  stage: .post
  tags:
    - privileged-docker
  dependencies: [] # a ".post" job otherwise downloads every artifact of the pipeline
  variables:
    GIT_STRATEGY: none
    GIT_SUBMODULE_STRATEGY: none
  script:
    - |
      if [ "$CODE_COVERAGE" = "true" ]; then
        marker="LAST_COVERAGE_SHA"
      else
        marker="LAST_NIGHTLY_SHA"
      fi
      api_url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/variables"
      http_code=$(curl --silent --output /dev/null --write-out "%{http_code}" \
        --request PUT --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
        --data-urlencode "value=$CI_COMMIT_SHA" "$api_url/$marker")
      case "$http_code" in # anything but a success means the variable is missing
        2*) ;;
        *)  http_code=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --request POST --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
              --data-urlencode "key=$marker" --data-urlencode "value=$CI_COMMIT_SHA" \
              --data "protected=true" --data "masked=false" "$api_url") ;;
      esac
      case "$http_code" in
        2*) echo "$marker set to $CI_COMMIT_SHA" ;;
        *)  echo "Could not record $marker (HTTP $http_code), check that GITLAB_API_TOKEN has the 'api' scope and the Maintainer role"
            exit 1 ;;
      esac
  rules:
    - !reference [.skip_if_already_built, rules]
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
  allow_failure: true

builder appstream-linter:
  image:
    name: ghcr.io/flathub/flatpak-builder-lint:latest
    entrypoint: [""]
  stage: static_analysis
  tags:
    - privileged-docker
  variables:
    # Two merge request pipelines can reach this job at once, see ".build".
    GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_CONCURRENT_ID/$CI_PROJECT_PATH
  before_script:
    - pip install jinja2-cli
  script:
    - cd buildstream
    - APPSTREAM_LINTER=true ./generate_appstream_metadata.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - README.md
        - buildstream/files/org.squey.Squey.metainfo.xml.j2
  interruptible: true
  allow_failure: false

.build:
  stage: build
  image:
    name: "$BASE_IMAGE_NAME"
    pull_policy: [if-not-present]
  tags:
    - privileged-docker
  needs: [] # start as soon as the pipeline does, do not wait for the earlier stages
  variables:
    # Give every runner slot its own clone to avoid collisions
    GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_CONCURRENT_ID/$CI_PROJECT_PATH
  before_script:
    - |
      # Isolate the BuildStream cache per runner slot: concurrent jobs on the same
      # runner must never share a local CAS directory, otherwise their independent
      # buildbox-casd LRU cleanups race and evict each other's blobs mid-staging.
      # Durable artifacts live in the shared casd daemon (storage-service);
      # these per-slot caches are purgeable pass-through.
      export XDG_CACHE_HOME="$HOME/.cache/bst-slots/bst-slot-${CI_CONCURRENT_ID:-0}"
      # Only offer the build dependencies to the shared pool when this pipeline
      # can bring new ones: an untouched buildstream directory means they are
      # all there already (squey.bst itself is never pushed, see build.sh). The
      # comparison point is the target branch of a merge request, the previous
      # commit of a push, and the parent commit for scheduled and web pipelines
      # (they carry no "before" sha at all). A base commit the shallow clone
      # does not have falls back to pushing rather than starving the pool.
      base_sha="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}"
      git cat-file -e "${base_sha}^{commit}" 2> /dev/null || base_sha="${CI_COMMIT_SHA}~1"
      if [ "$FORCE_PUSH_ARTIFACTS" = "true" ] || ! git cat-file -e "${base_sha}^{commit}" 2> /dev/null; then
        export PUSH_ARTIFACTS=true
      elif git diff --quiet "$base_sha" "$CI_COMMIT_SHA" -- buildstream project.conf; then
        export PUSH_ARTIFACTS=false
      else
        export PUSH_ARTIFACTS=true
      fi
      echo "Pushing artifacts to the shared cache: $PUSH_ARTIFACTS"
      # The submodules the top-level GIT_SUBMODULE_PATHS does not update: the ones
      # it leaves out entirely, and, as it only ever matches top-level paths,
      # anything below src/libpvcop. squey-utils is needed by every build
      # (add_subdirectory), the test files by every job that builds the test
      # suite, as building it copies and installs test files, not only by the ones
      # that run it. These run before the token rewrite below, while the
      # CI token in the submodule remotes is still the one that can fetch.
      # Each update is preceded by a sync, which the runner only performs for the
      # paths it updates itself: without it the remote of a submodule already
      # cloned in the working directory keeps the relative URL of .gitmodules,
      # and fetching a newly referenced commit dies on "transport 'file' not
      # allowed", leaving the submodule on its previous commit.
      git -C src/libpvcop submodule sync squey-utils
      git -C src/libpvcop submodule update --init --depth 1 squey-utils
      if [ "$TEST_FILES" = "true" ]; then
        git submodule sync src/tests
        git submodule update --init --depth 1 src/tests
        # ninja pvcop_testsuite, hence PVCOP_TEST, only runs under code coverage.
        if [ "$CODE_COVERAGE" = "true" ]; then
          git -C src/libpvcop submodule sync tests/files
          git -C src/libpvcop submodule update --init --depth 1 tests/files
        fi
      fi
      # git lfs pull
      for f in .git/modules/*/config .git/config; do sed "s/gitlab-ci-token:[[:alnum:]]\+/gitlab-ci_read-repository:$GITLAB_DEPLOY_TOKEN_READ_REPOSITORY/g" -i "$f"; done
      cd buildstream
  interruptible: true

.archs:
  macos-arm64: # macOS Apple Silicon
    matrix:
      - TARGET_TRIPLE: aarch64-apple-darwin
        TARGET_TAG: saas-macos-large-m2pro
        IMAGE_NAME: macos-15-xcode-16
  macos-x86_64: # macOS Intel
    matrix:
      - TARGET_TRIPLE: x84_64-apple-darwin
        TARGET_TAG: ""
        IMAGE_NAME: ""
  windows:
    matrix:
      # Windows
      - TARGET_TRIPLE: x86_64-w64-mingw32
        TARGET_TAG: saas-windows-medium-amd64
        IMAGE_NAME: ""

build and run testsuite linux:
  extends: .build
  variables:
    # Runs ctest, unlike the cross-compiled builds which stop before it.
    TEST_FILES: "true"
  script:
    - |
      # Both instrumentations are opt-in through their own pipeline variable, so every
      # schedule picks what it runs, and a single one can ask for both: the builds then
      # follow each other in this very job, sharing a warm BuildStream cache instead of
      # waiting for another schedule to get a runner slot. They stay two distinct builds
      # on purpose, as ASAN aborts the process on the first error it finds, which would
      # truncate the coverage data gcov only writes at exit.
      run_testsuite=true; run_coverage=false; sanitize=false
      [ "$ADDRESS_SANITIZER" = "true" ] && sanitize=true
      if [ "$CODE_COVERAGE" = "true" ]; then
        run_coverage=true
        # A coverage-only pipeline has no test suite build of its own to run
        [ "$sanitize" = "true" ] || run_testsuite=false
      fi

      # A sanitizer failure must not cost the coverage report below: remember it instead
      # of letting the shell stop here, and fail the job at the very end.
      status=0
      if [ "$run_testsuite" = "true" ]; then
        ./build.sh \
          --cxx-compiler=clang++ \
          --branch="${CI_COMMIT_REF_NAME}" \
          --export=$(echo $CI_MERGE_REQUEST_LABELS | grep -q "export_linux_package" && echo true || echo false) \
          --export-dir="/srv/flatpak_repo" \
          --code-coverage=false \
          --address-sanitizer=$sanitize \
          --push-artifacts="${PUSH_ARTIFACTS}" || status=$?
      fi
      if [ "$run_coverage" = "true" ]; then
        # Keep the sanitized run's test report, the coverage build overwrites junit.xml
        mv junit.xml junit-sanitized.xml 2> /dev/null || true
        ./build.sh \
          --cxx-compiler=g++ \
          --branch="${CI_COMMIT_REF_NAME}" \
          --code-coverage=true \
          --push-artifacts="${PUSH_ARTIFACTS}" || status=$?
      fi
      exit $status
  coverage: '/lines: (\d+\.\d+)% \(\d+ out of \d+\)/'
  rules:
    - !reference [.skip_if_already_built, rules]
    - if: '$CI_COMMIT_TAG =~ "/^$/"'
  artifacts:
    when: always
    paths:
      - junit.xml
      - junit-sanitized.xml
      - code_coverage_report
      - export
    reports:
      junit:
        - junit.xml
        - junit-sanitized.xml

build testsuite windows:
  extends: .build
  variables:
    # ctest does not run here, but building the test suite copies test files next to
    # the test binaries and installs them into the exported package, which the matching
    # 'run testsuite' job unpacks to run ctest from.
    TEST_FILES: "true"
  script:
    - ./build.sh
      --target_triple="${TARGET_TRIPLE}"
      --user-target=customer
      --branch="${CI_COMMIT_REF_NAME}"
      --export=true
      --export-dir="$CI_PROJECT_DIR/export"
      --push-artifacts="${PUSH_ARTIFACTS}"
  rules:
    - !reference [.skip_if_already_built, rules]
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CODE_COVERAGE != "true"'
      when: always
    - if: "$CI_MERGE_REQUEST_LABELS =~ /(^|,)export_windows_package(,|$)/"
      when: always
    - if: '$CI_COMMIT_TAG =~ /^release-\d+\.\d+\.\d+$/'
      when: always
    - when: never
  artifacts:
    when: always
    paths:
      - junit.xml
      - export
    reports:
      junit: junit.xml
  parallel: !reference [.archs, windows]

build testsuite macos:
  extends: .build
  variables:
    # Same as the windows build above : the test files are needed at build time.
    TEST_FILES: "true"
  script:
    - ./build.sh
      --target_triple="${TARGET_TRIPLE}"
      --macos-sdk-dir="/srv/macos_sdk"
      --user-target=customer
      --branch="${CI_COMMIT_REF_NAME}"
      --export=true
      --export-dir="$CI_PROJECT_DIR/export"
      --push-artifacts="${PUSH_ARTIFACTS}"
  rules:
    - !reference [.skip_if_already_built, rules]
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CODE_COVERAGE != "true"'
      when: always
    - if: "$CI_MERGE_REQUEST_LABELS =~ /(^|,)export_macos_package(,|$)/"
      when: always
    - if: '$CI_COMMIT_TAG =~ /^release-\d+\.\d+\.\d+$/'
      when: always
    - when: never
  artifacts:
    when: always
    paths:
      - junit.xml
      - export
    reports:
      junit: junit.xml
  parallel: !reference [.archs, macos-arm64]

build release macos:
  extends: .build
  variables:
    # Same as the windows build above : the test files are needed at build time.
    TEST_FILES: "true"
  needs:
    - job: build testsuite macos
      artifacts: true
  script:
    - ./build.sh
      --target_triple="x86_64-apple-darwin"
      --macos-sdk-dir="/srv/macos_sdk"
      --user-target=customer
      --branch="${CI_COMMIT_REF_NAME}"
      --export=true
      --export-dir="$CI_PROJECT_DIR/export"
      --push-artifacts="${PUSH_ARTIFACTS}"
  rules:
    - !reference [.skip_if_already_built, rules]
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CODE_COVERAGE != "true"'
      when: always
    - if: '$CI_COMMIT_TAG =~ /^release-\d+\.\d+\.\d+$/'
      when: always
    - when: never
  artifacts:
    when: always
    paths:
      - junit.xml
      - export
    reports:
      junit: junit.xml

.run testsuite macos:
  - .gitlab-ci/run_testsuite.sh

.run testsuite windows:
  - .gitlab-ci\run_testsuite.ps1

.run testsuite:
  stage: test
  image: $IMAGE_NAME
  tags:
    - $TARGET_TAG
  before_script: |
    git submodule sync src/tests
    git submodule update --init --depth 1 src/tests # src/libpvcop
  needs:
    - job: build testsuite
      artifacts: true
  variables:
    GIT_SUBMODULE_STRATEGY: none
  artifacts:
    when: always
    paths:
      - junit.xml
    reports:
      junit: junit.xml
  interruptible: true

run testsuite windows:
  extends: .run testsuite
  parallel: !reference [.archs, windows]
  script:
    - !reference [.run testsuite windows]
  rules:
    - !reference [.skip_if_already_built, rules]
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CODE_COVERAGE != "true"'
      when: on_success
    - if: "$CI_MERGE_REQUEST_LABELS =~ /(^|,)export_windows_package(,|$)/"
      when: on_success
    - if: '$CI_COMMIT_TAG =~ /^release-\d+\.\d+\.\d+$/'
      when: on_success
    - when: never
  needs:
    - job: build testsuite windows
      artifacts: true

run testsuite macos:
  extends: .run testsuite
  parallel: !reference [.archs, macos-arm64]
  script:
    - !reference [.run testsuite macos]
  rules:
    - !reference [.skip_if_already_built, rules]
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CODE_COVERAGE != "true"'
      when: on_success
    - if: "$CI_MERGE_REQUEST_LABELS =~ /(^|,)export_macos_package(,|$)/"
      when: on_success
    - if: '$CI_COMMIT_TAG =~ /^release-\d+\.\d+\.\d+$/'
      when: on_success
    - when: never
  needs:
    - job: build testsuite macos
      artifacts: true
  allow_failure: false

build release linux:
  extends: .build
  variables:
    # Native build, so squey.bst runs ctest here too.
    TEST_FILES: "true"
  script:
    - ./build.sh
      --user-target=customer
      --cxx-compiler=clang++
      --branch="${CI_COMMIT_REF_NAME}"
      --export=true
      --export-dir="$CI_PROJECT_DIR/public/flatpak"
      --gpg-private-key-path=$GPG_PRIVATE_KEY
      --gpg-sign-key=ADAD28A413FCB239A979C83B7C828C315B98BC63
      --upload-debug-symbols=true
      --push-artifacts="${PUSH_ARTIFACTS}"
  artifacts:
    paths:
      - public/flatpak
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-\d+\.\d+\.\d+$/
      when: always
  allow_failure: false

macos_publish:
  stage: macos_publish
  image: "$IMAGE_NAME"
  variables:
    GIT_SUBMODULE_STRATEGY: none
  tags:
    - $TARGET_TAG
  parallel: !reference [.archs, macos-arm64]
  before_script:
    - gem install fastlane
  script:
    - |
      "$CI_PROJECT_DIR/.gitlab-ci/macos_publish.sh"
  artifacts:
    paths:
      - public
  needs:
    - job: build testsuite macos
      artifacts: true
    - job: run testsuite macos
      artifacts: false
    - job: build release macos
      artifacts: true
    - job: run testsuite windows
      artifacts: false
    - job: build release linux
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-\d+\.\d+\.\d+$/

pages:
  stage: pages
  image:
    name: "$BASE_IMAGE_NAME"
    pull_policy: [if-not-present]
  tags:
    - privileged-docker
  variables:
    # Repackages artifacts and reads VERSION.txt, never a submodule.
    GIT_SUBMODULE_STRATEGY: none
    GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_CONCURRENT_ID/$CI_PROJECT_PATH
  before_script:
    - mkdir -p $CI_PROJECT_DIR/public
  script:
    - |
      VERSION=$(cat $CI_PROJECT_DIR/VERSION.txt | tr -d '\n')
      PIPELINE_ID=`curl -s -X GET ${CI_API_V4_URL}/projects/squey%2Fsquey/pipelines?scope=tags | jq -r .[0].id`
      JOB_ID=`curl -s -X GET ${CI_API_V4_URL}/projects/squey%2Fsquey/pipelines/${PIPELINE_ID}/jobs | jq -r '.[] | select(.stage=="pages") | .id'`
      if [ "$CODE_COVERAGE" = "true" ]; then
        curl -XGET -L ${CI_PROJECT_URL}/-/jobs/${JOB_ID}/artifacts/download | bsdtar -xvf- || true
        rm -rf $CI_PROJECT_DIR/public/code_coverage_report $CI_PROJECT_DIR/public/code_quality_report
        mv code_coverage_report $CI_PROJECT_DIR/public
        mv code_quality_report $CI_PROJECT_DIR/public || true # the code quality job is allowed to fail
        exit 0
      fi
      ostree checkout -U --repo="$CI_PROJECT_DIR/public/flatpak" app/org.squey.Squey/x86_64/release-$VERSION public/flatpak_app && cd public/flatpak_app && XZ_OPT=-9T0 tar Jcvf "$CI_PROJECT_DIR/public/squey_flatpak_$VERSION.tar.xz" . && cd - && rm -rf "$CI_PROJECT_DIR/public/flatpak_app"
      rm -rf "$CI_PROJECT_DIR/public/flatpak"
      mv "$CI_PROJECT_DIR/export/x86_64-w64-mingw32/squey-win64-standalone-latest.zip" "$CI_PROJECT_DIR/public"
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: public/code_coverage_report/cobertura-coverage.xml
    paths:
      - public
    when: on_success
    expire_in: 1 day
  rules:
    - !reference [.skip_if_already_built, rules]
    - if: '$CI_COMMIT_TAG =~ /^release-\d+\.\d+\.\d+$/ || $CODE_COVERAGE == "true"'
  # Release and code coverage pipelines do not run the same set of jobs, so every
  # dependency has to be optional for the pipeline to be created in both cases
  needs:
    - job: build and run testsuite linux
      artifacts: true
      optional: true
    - job: code_quality
      artifacts: true
      optional: true
    - job: build release linux
      artifacts: true
      optional: true
    - job: build testsuite windows
      artifacts: true
      optional: true
    - job: macos_publish
      artifacts: true
      optional: true
  interruptible: true

flathub:
  stage: flathub_publish
  image:
    name: "$BASE_IMAGE_NAME"
    pull_policy: [if-not-present]
  tags:
    - privileged-docker
  needs:
    - pages
  variables:
    # Only needs VERSION.txt and buildstream/flathub.
    GIT_SUBMODULE_STRATEGY: none
    GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_CONCURRENT_ID/$CI_PROJECT_PATH
  before_script:
    - |
      export GIT_SSH_COMMAND="ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no"
      eval $(ssh-agent -s)
      echo "$SSH_FLATHUB_PRIVATE_KEY_B64" | base64 -d | ssh-add - > /dev/null
      rm -rf org.squey.Squey
      git clone git@github.com:flathub/org.squey.Squey.git
      git config --global user.name "$FLATHUBGITCREDENTIALUSERNAME"
      git config --global user.email "$FLATHUBGITCREDENTIALEMAIL"
      export VERSION=$(cat $CI_PROJECT_DIR/VERSION.txt | tr -d '\n')
      export BRANCH_NAME="publish-$VERSION"
      cd "$CI_PROJECT_DIR/org.squey.Squey"
      git checkout -b "$BRANCH_NAME"
  script:
    - |
      cp "$CI_PROJECT_DIR/buildstream/flathub/flathub.json" "$CI_PROJECT_DIR/org.squey.Squey"
      jinja2 -D sha256=$(sha256sum "$CI_PROJECT_DIR/public/squey_flatpak_$VERSION.tar.xz" | awk '{print $1 }') -D version=$VERSION $CI_PROJECT_DIR/buildstream/flathub/org.squey.Squey.yaml.j2 > "$CI_PROJECT_DIR/org.squey.Squey/org.squey.Squey.yaml"
      git commit -a -m "Publish version $VERSION" || echo "No changes to commit"
      git push -f --set-upstream origin "$BRANCH_NAME"
      echo "$FLATHUB_GITHUB_PR_TOKEN" | gh auth login --with-token
      gh pr --repo "flathub/org.squey.Squey" create --head master --base "$BRANCH_NAME" --fill || true
      gh pr --repo "flathub/org.squey.Squey" merge "$BRANCH_NAME" --auto --merge --delete-branch
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-\d+\.\d+\.\d+$/

code_quality:
  stage: static_analysis
  image:
    name: "$BASE_IMAGE_NAME"
  tags:
    - saas-linux-medium-amd64
  needs: []
  variables:
    # Only fetch the submodules holding source code we analyze, the test suite
    # one is too big to be worth cloning here
    GIT_SUBMODULE_STRATEGY: normal
    GIT_SUBMODULE_PATHS: src/furl src/squey-utils src/libpvcop
    GIT_SUBMODULE_DEPTH: 1
  script:
    - .gitlab-ci/code_quality.sh
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json
      - code_quality_report
    expire_in: 1 week
  rules:
    - !reference [.skip_if_already_built, rules]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CODE_COVERAGE == "true"'
  interruptible: true
  allow_failure: true

sast:
  variables:
    SAST_EXCLUDED_PATHS: external, tests, doc
    SAST_EXCLUDED_ANALYZERS:
      bandit, brakeman, gosec, kubesec, nodejs-scan, phpcs-security-audit,
      pmd-apex, security-code-scan, sobelow, spotbugs, flawfinder
  stage: static_analysis
  tags:
    - saas-linux-medium-amd64
  needs: []
include:
  - template: Security/SAST.gitlab-ci.yml
  #- template: Jobs/Secret-Detection.latest.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

semgrep-sast:
  variables:
    GIT_SUBMODULE_STRATEGY: none
  rules:
    - !reference [.skip_if_already_built, rules]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  interruptible: true


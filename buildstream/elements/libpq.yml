description: |

  PostgreSQL is a powerful, open source object-relational database system with over 30 years of active development that has earned it a strong reputation for reliability, feature robustness, and performance.

sources:
  - kind: tar
    url: postgresql:pub/source/v18.6/postgresql-18.6.tar.bz2
    ref: 555610c24d53e4316da5b7d3fc25c279d96856d5e0e23ee308c328c5fa881d9f

variables:
  conf-local: |
    --with-ssl=openssl

config:
  install-commands:
    - |
      make -j1 DESTDIR="%{install-root}" install
      rm -rf %{install-root}%{libdir}/postgresql # Delete useless server part
      # ECPG, the embedded SQL preprocessor and its runtime, is dead weight here:
      # Qt is the only consumer of this element and its sqldrivers plugin links
      # against libpq alone, while libecpg, libecpg_compat and libpgtypes merely
      # import one another. Windows installs shared libraries under both bindir
      # and libdir (src/Makefile.shlib), so both have to be cleaned out.
      rm -rf %{install-root}%{bindir}/ecpg %{install-root}%{bindir}/ecpg.exe \
             %{install-root}%{bindir}/{libecpg,libpgtypes}* \
             %{install-root}%{libdir}/{libecpg,libpgtypes}* \
             %{install-root}%{libdir}/pkgconfig/{libecpg,libpgtypes}*.pc

depends:
  - freedesktop-sdk.bst:components/bison.bst
  - freedesktop-sdk.bst:components/flex.bst

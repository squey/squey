description: |

  MariaDB Connector/C is used to connect applications developed in C/C++ to MariaDB and MySQL databases.

sources:
  - kind: tar
    url: github:mariadb-corporation/mariadb-connector-c/archive/refs/tags/v3.4.9.tar.gz
    ref: 2c70b74393d589df0bde9b3e17cb7b571d30a45aaf006eda7a273120fb660f3a

variables:
  cmake-local-extra: ""
  # The library goes beside the others rather than into lib/mariadb, the
  # default, where nothing looks for it: the MySQL driver of Qt has the library
  # directory of Qt as its runpath, and the Windows package takes the DLLs of
  # lib alone. The plugins have a directory of their own, which stays
  # lib/mariadb/plugin.
  cmake-local: >-
    -DWITH_EXTERNAL_ZLIB=ON
    -DINSTALL_LIBDIR=%{lib}
    %{cmake-local-extra}
